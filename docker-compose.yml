services:
  api:
    image: customer-churn-api:1.2
    container_name: customer-churn-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://churn_user:churn_password@db:5432/churn_db

  db:
    image: postgres:16
    container_name: customer-churn-db
    environment:
      POSTGRES_USER: churn_user
      POSTGRES_PASSWORD: churn_password
      POSTGRES_DB: churn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
